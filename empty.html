<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Setup UI</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      }

      body {
        background-color: #0d0b0a;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        padding: 20px;
      }

      .container {
        width: 100%;
        max-width: 400px;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      /* Main Setup Card */
      .card {
        background-color: #1a1614;
        border: 1px solid #2a2420;
        border-radius: 24px;
        padding: 28px 24px;
        color: #ffffff;
      }

      .title {
        font-size: 1.35rem;
        font-weight: 700;
        margin-bottom: 6px;
        letter-spacing: -0.02em;
      }

      .subtitle {
        color: #a0988f;
        font-size: 0.95rem;
        margin-bottom: 28px;
      }

      /* Steps List */
      .steps {
        display: flex;
        flex-direction: column;
        gap: 20px;
        margin-bottom: 32px;
      }

      .step-item {
        display: flex;
        align-items: center;
        gap: 16px;
      }

      .step-number {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 600;
        font-size: 0.9rem;
        flex-shrink: 0;
      }

      /* Active Step */
      .step-item.active .step-number {
        background-color: #f5a638;
        color: #0d0b0a;
      }

      .step-item.active .step-text {
        color: #ffffff;
        font-weight: 600;
        font-size: 1.05rem;
      }

      /* Inactive Steps */
      .step-item.inactive .step-number {
        border: 1px solid #3a342f;
        color: #8c827a;
      }

      .step-item.inactive .step-text {
        color: #8c827a;
        font-size: 1.05rem;
        font-weight: 400;
      }

      /* Action Button */
      .cta-button {
        width: 100%;
        background-color: #f5a638;
        color: #0d0b0a;
        border: none;
        border-radius: 999px;
        padding: 16px;
        font-size: 1.05rem;
        font-weight: 700;
        cursor: pointer;
        transition: background-color 0.2s ease;
      }

      .cta-button:hover {
        background-color: #e59728;
      }

      /* Bottom Info Box */
      .info-card {
        background-color: #1a1614;
        border: 1px dashed #3a342f;
        border-radius: 20px;
        padding: 20px;
        display: flex;
        align-items: center;
        gap: 16px;
      }

      .icon-wrapper {
        width: 44px;
        height: 44px;
        border: 1px solid #3a342f;
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
      }

      .icon-wrapper svg {
        width: 22px;
        height: 22px;
        stroke: #d0c8be;
      }

      .info-text {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }

      .info-title {
        color: #ffffff;
        font-size: 1rem;
        font-weight: 600;
      }

      .info-description {
        color: #a0988f;
        font-size: 0.9rem;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <!-- Main Card -->
      <div class="card">
        <h2 class="title">Set up in 3 steps</h2>
        <p class="subtitle">Then you can scout fields and save verified results.</p>

        <div class="steps">
          <!-- Step 1 -->
          <div class="step-item active">
            <div class="step-number">1</div>
            <div class="step-text">Connect your wallet</div>
          </div>

          <!-- Step 2 -->
          <div class="step-item inactive">
            <div class="step-number">2</div>
            <div class="step-text">Register your farm</div>
          </div>

          <!-- Step 3 -->
          <div class="step-item inactive">
            <div class="step-number">3</div>
            <div class="step-text">Add a field with GPS</div>
          </div>
        </div>

        <button class="cta-button">Connect wallet</button>
      </div>

      <!-- Bottom Info Box -->
      <div class="info-card">
        <div class="icon-wrapper">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="1.8"
            stroke="currentColor"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M6.827 6.175A2.31 2.31 0 015.186 7.23c-.38.054-.757.112-1.134.175C2.999 7.58 2.25 8.507 2.25 9.574V18a2.25 2.25 0 002.25 2.25h15A2.25 2.25 0 0021.75 18V9.574c0-1.067-.75-1.994-1.802-2.169a47.865 47.865 0 00-1.134-.175 2.31 2.31 0 01-1.64-1.055l-.822-1.316a2.192 2.192 0 00-1.736-1.039 48.774 48.774 0 00-5.232 0c-.693.041-1.317.435-1.736 1.039l-.822 1.316z"
            />
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M16.5 12.75a4.5 4.5 0 11-9 0 4.5 4.5 0 019 0zM18.75 10.5h.008v.008h-.008V10.5z"
            />
          </svg>
        </div>
        <div class="info-text">
          <span class="info-title">Scouting unlocks after step 3</span>
          <span class="info-description">Scan a field to get a diagnosis you can verify.</span>
        </div>
      </div>
    </div>
  </body>
</html>
